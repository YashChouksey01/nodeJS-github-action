name: Testing and Building my app
on: 
  push:
    branches: [main]
    paths:    
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      
  #  pull_request:
  #   types: [opened, closed] 
  
  #push
# on: [push, pull_request , 'workflow_dispatch']

jobs:
  test:
    runs-on: ubuntu-slim
    steps:
      - name: getting my code first
        uses: actions/checkout@v6
      - name: installing node
        uses: actions/setup-node@v6
        with:
          node-version: '22.15.1'
      - name: installing dependencies
        run: npm install
      - name: testing app
        run: npm test 
