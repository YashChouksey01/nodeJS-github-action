name: testing & building app
on: push
jobs:
  test:
    runs-on: ubuntu-slim
    steps:
      - name: bringing my code
        uses: actions/checkout@v7
      # - name: install node
      #   uses: actions/setup-node@v6 
      #   with:
      #     node-version: '22.15.1'
      - name: installing dependencies
        run: npm install
      - name: test app
        run: npm test
  build:
     runs-on: ubuntu-slim
     steps:
       - name: getting my code
         uses: actions/checkout@v6
       - name: install dependies
         run: npm install
       - name: build app
         run: npm run build
